<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mothership" />
    <meta name="theme-color" content="#16171a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon.svg" />
    <title>Mothership</title>
    <script>
      // If the app's own script or stylesheet fails to load (a rebuild mid-load), reload instead of
      // staying blank. At most 3 tries per minute, so a real outage can't loop.
      addEventListener('error', e => {
        const t = e.target
        if (!t || !(t.tagName === 'SCRIPT' || t.tagName === 'LINK')) return
        try {
          const n = JSON.parse(sessionStorage.getItem('perch.reloads') || '[]').filter(x => Date.now() - x < 60000)
          if (n.length >= 3) return
          sessionStorage.setItem('perch.reloads', JSON.stringify([...n, Date.now()]))
        } catch {}
        setTimeout(() => location.reload(), 1500)
      }, true)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
